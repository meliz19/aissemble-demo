# Default values for aissemble-machine-learning-inference.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

replicaCount: 1

hostname: aissemble-machine-learning-inference
image:
  name: aissemble-demo-aissemble-machine-learning-inference-docker
  imagePullPolicy: Always
  dockerRepo: docker-registry-PLACEHOLDER/repository/
  # Overrides the image tag whose default is the chart appVersion.
  tag: ""

service:
  spec:
    ports:
      - name: "api"
        port: 6574
        targetPort: 8000
      - name: "grpc-api"
        port: 6575
        targetPort: 8081
deployment:
  ports:
    - name: http-1
      containerPort: 8000
      protocol: TCP
    - name: grpc-1
      containerPort: 8081
      protocol: TCP
  restartPolicy: Always
  volumeMounts:
    - mountPath: /tmp/model
      name: model
  volumes:
    - name: model
      persistentVolumeClaim:
        claimName: model

ingress:
  enabled: true
  metadata:
    annotations:
      kubernetes.io/ingress.class: nginx
  hosts:
    - host: aissemble-machine-learning-inference-ai.boozallen.github.io
      paths:
        - path: /
          pathType: Prefix
          backend:
            service:
              name: aissemble-machine-learning-inference
              port:
                number: 6574
  status: 10.192.83.167
